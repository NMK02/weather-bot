name: Daily weather

on:
  schedule:
    - cron: "0 22 * * *"   # setiap hari 22:00 UTC = 05:00 WIB
  workflow_dispatch:         # tombol untuk menjalankan manual

permissions:
  contents: write            # izin untuk menyimpan Excel ke repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v5

      - name: Pasang Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Pasang paket
        run: pip install -r requirements.txt

      - name: Jalankan bot
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Simpan Excel ke repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add weather_log.xlsx
          git commit -m "Update weather log" || echo "Tidak ada perubahan"
          git push